# pnpm 11 only reads auth/registry settings from .npmrc; everything else lives here.

# Flat node_modules, required so native C++ builds don't hit the Windows 260-char path limit.
nodeLinker: hoisted

# pnpm blocks dependency build scripts by default (strictDepBuilds errors on unapproved ones).
allowBuilds:
  # Pulled in by Jest 30; ships prebuilt binaries and its install script only builds from source on opt-in.
  '@parcel/watcher': false
  unrs-resolver: true

# pnpm 11 refuses versions younger than minimumReleaseAge; these SDK 58 releases were too fresh at upgrade time.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.15'
  - '@expo/config@58.0.8'
  - '@expo/local-build-cache-provider@58.0.8'
  - '@expo/metro-config@58.0.17'
  - '@expo/prebuild-config@58.0.16'
  - '@expo/router-server@58.0.17'
  - babel-preset-expo@58.0.20
  - expo-file-system@58.0.11
  - expo-font@58.0.10
  - expo-modules-autolinking@58.0.15
  - expo-modules-cli@0.3.2
  - expo-modules-core@58.0.26
  - expo-modules-jsi@58.0.19
  - expo-server@58.0.6
  - expo@58.0.19
  - expo-glass-effect@58.0.5
  - expo-router@58.0.26
  - expo-sqlite@58.0.14
